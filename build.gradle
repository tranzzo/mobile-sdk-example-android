plugins {
    // AGP 9 has built-in Kotlin support, so no separate Kotlin plugin is applied.
    id 'com.android.application' version '9.3.1' apply false
}

ext {
    appcompat_version = '1.8.0'
    constraint_version = '2.2.2'
    core_version = '1.18.0' // 1.19.0 requires compileSdk 37
    material_version = '1.14.0'
    activity_version = '1.13.0'
    jwt_version = '0.13.0'
}
