plugins {
    id 'com.android.application'
}

android {
    namespace "com.help.ukraine.tranzzosdkexample"
    compileSdk 36

    defaultConfig {
        applicationId "com.help.ukraine.tranzzosdkexample"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tranzzo.android:payment_merchant:4.0.3'
    implementation "androidx.constraintlayout:constraintlayout:$constraint_version"
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "com.google.android.material:material:$material_version"
    implementation "androidx.activity:activity-ktx:$activity_version"
    api "io.jsonwebtoken:jjwt-api:$jwt_version"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:$jwt_version"
    runtimeOnly("io.jsonwebtoken:jjwt-orgjson:$jwt_version") {
        exclude group: 'org.json', module: 'json' //provided by Android natively
    }
}
